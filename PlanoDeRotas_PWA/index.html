            const batch = db.batch();
            docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));

            deleted += Math.min(400, docs.length - i);
        }

async function buildEntityReport(collectionName, entitySlug, dates, clients) {
    const rows = [];
    let visited = 0, skipped = 0;
    const docs = await Promise.all(dates.map((dateISO) => fsGetDoc(`${collectionName}/${dateISO}_${entitySlug}`).then((data) => ({ dateISO, data }))));
    docs.forEach(({ dateISO, data }) => {
        if (!data)
            return;
        const obj = data.entries || {};
        Object.entries(obj).forEach(([clientId, rec]) => {
            const client = clients.find((c) => c.id === clientId);
            rows.push({
                date: dateISO,
                clientId,
                client: client ? client.name : clientId,
                market: client ? client.market : "",
                salesperson: client ? client.salesperson : "",
                oldCode: client ? client.oldCode || "" : "",
                status: rec.status || "visited",
                reason: rec.reason || "",
                notes: rec.notes || "",
                time: rec.timestamp ? formatTimeLocal(rec.timestamp) : "",
                gps: rec.gps || null,
                gpsSkipped: rec.gpsSkipped || false,
                order: rec.order || null,
                payment: rec.payment || null,
                durationMinutes: rec.durationMinutes != null ? rec.durationMinutes : null,
                orderItems: rec.orderItems || [],
                orderTotal: rec.orderTotal || 0,
            });
            if ((rec.status || "visited") === "visited")
                visited++;
            else if (rec.status === "skipped")
                skipped++;
        });
    });
    rows.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    const totalSalesKz = rows.reduce((a, r) => a + (r.orderTotal || 0), 0);

}

        if (!data)
            return;
        Object.entries(data.entries || {}).forEach(([orderKey, rec]) => {
            result[`${dateISO}_${orderKey}`] = { items: rec.items || [], total: rec.total || 0, contactPhone: rec.contactPhone || "", orderKey, clientId: rec.clientId || orderKey };
        });
    });

}
function buildProductAnalysis(rows) {

            if (!overall[item.product])
                overall[item.product] = { product: item.product, quantity: 0, valueKz: 0 };

            overall[item.product].valueKz += item.valueKz;
            const market = r.market || "Sem mercado";
            if (!byMarket[market])
                byMarket[market] = {};
            if (!byMarket[market][item.product])
                byMarket[market][item.product] = { product: item.product, quantity: 0, valueKz: 0 };
            byMarket[market][item.product].quantity += item.quantity;
            byMarket[market][item.product].valueKz += item.valueKz;
        });
    });
    const overallSorted = Object.values(overall).sort((a, b) => b.quantity - a.quantity);

        report.rows.push({
            date, clientId, orderKey: val.orderKey, client: client ? client.name : clientId, market: client ? client.market : "",
            salesperson: client ? client.salesperson : "", oldCode: client ? client.oldCode || "" : "",

            durationMinutes: null, orderItems: val.items, orderTotal: val.total, contactPhone: val.contactPhone || "",

}

function daysBetween(dateISOa, dateISOb) {
    const a = new Date(dateISOa + "T00:00:00");

    return Math.round((b - a) / (1000 * 60 * 60 * 24));

async function buildOverdueReport(clients, allReps, allSupervisorSlugs) {
    const today = todayISO();
    const lookbackDates = lastNDates(30);
    const lastVisitByClient = {};
    const repReports = await Promise.all(allReps.map((rep) => buildRepReport(rep.slug, lookbackDates, clients)));
    const supReports = await Promise.all((allSupervisorSlugs || []).map((slug) => buildSupVisitReport(slug, lookbackDates, clients)));
    const adminReport = await buildEntityReport("admin_visits", "admin", lookbackDates, clients);
    [...repReports, ...supReports, adminReport].forEach(({ rows }) => {
        rows.forEach((r) => {
            if (r.status !== "visited")
                return;
            if (!lastVisitByClient[r.clientId] || r.date > lastVisitByClient[r.clientId]) {
                lastVisitByClient[r.clientId] = r.date;
            }
        });
    });
    const overdue = [];
    clients.forEach((c) => {
        const threshold = c.cycleType && c.cycleType.startsWith("2-Week") ? 14 : 7;
        const lastDate = lastVisitByClient[c.id] || null;
        const daysSince = lastDate ? daysBetween(lastDate, today) : null;
        const isOverdue = daysSince === null ? true : daysSince > threshold;
        if (isOverdue) {
            overdue.push({
                client: c.name, clientId: c.id, market: c.market, salesperson: c.salesperson,
                supervisor: c.supervisor, oldCode: c.oldCode || "", lastDate, daysSince, threshold,
            });
        }
    });
    overdue.sort((a, b) => {
        if (a.daysSince === null && b.daysSince === null)
            return 0;
        if (a.daysSince === null)
            return -1;
        if (b.daysSince === null)
            return 1;
        return b.daysSince - a.daysSince;
    });
    return overdue;
}
function loadImageAsDataURL(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            try {
                const canvas = document.createElement("canvas");
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0);
                resolve(canvas.toDataURL("image/png"));
            }
            catch (e) {
                reject(e);
            }
        };
        img.onerror = (e) => reject(e);
        img.src = src;
    });
}
