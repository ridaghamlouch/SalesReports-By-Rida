    const supReports = await Promise.all((allSupervisorSlugs || []).map((slug) => buildSupVisitReport(slug, lookbackDates, clients)));
    const adminReport = await buildEntityReport("admin_visits", "admin", lookbackDates, clients);

        rows.forEach((r) => {

                supervisor: c.supervisor, oldCode: c.oldCode || "", lastDate, daysSince, threshold,

    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            try {
                const canvas = document.createElement("canvas");
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0);
                resolve(canvas.toDataURL("image/png"));
            }
            catch (e) {
                reject(e);
            }
        };

        img.src = src;
    });

    // set in the order editor - if the catalog didn't have a code yet (e.g. the "Material Code"
    // Excel column was only imported later), it's baked in as "" forever, even after the catalog
    // is fixed. To avoid that, fall back to a live lookup by product name against the CURRENT
    // catalog whenever an item has no code of its own - so a code import fixes old orders' PDFs
    // too, not just orders created after the import.
    const codeByProductName = {};
    (productCatalog || []).forEach((p) => { if (p.code)
        codeByProductName[p.name] = p.code; });
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const bottomMargin = 25;
    doc.setFillColor(30, 58, 138);
    doc.rect(0, 0, pageWidth, 32, "F");
    try {
        const logoDataUrl = await loadImageAsDataURL("icon-512.png");
        doc.addImage(logoDataUrl, "PNG", 14, 5, 22, 22);
    }
    catch (e) {
        console.error("Failed to load logo for PDF", e);
    }
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(15);
    doc.setFont(undefined, "bold");
    doc.text("BASEL ANGOLA", 42, 16);
    doc.setFontSize(10);
    doc.setFont(undefined, "normal");
    doc.text("Fatura Proforma", 42, 23);
    doc.setFontSize(9);
    // order.orderTimestamp is the moment the order was actually saved (set by saveOrderEntry) -
    // not the visit's own start time, which can be much earlier if the order was filled in later
    // from the Encomendas tab. Blank for an order that hasn't been saved yet (a brand new draft).
    doc.text(`Data: ${formatDatePT(order.date)}${order.orderTimestamp ? " · " + formatTimeLocal(order.orderTimestamp) : ""}`, pageWidth - 14, 15, { align: "right" });
    // Replaced the old "Ref: {date}-{clientId}" line (redundant with Data/SAP already shown
    // elsewhere on the page, and not even unique between two same-day orders for the same
    // client) with this person's running daily order count instead - assigned once at save
    // time (see saveOrderEntry), so it never shifts. Blank until the order is actually saved.
    if (order.orderNumber) {
        doc.text(`Encomenda nº ${order.orderNumber}`, pageWidth - 14, 21, { align: "right" });
    }
    doc.setTextColor(0, 0, 0);
    let y = 44;
    doc.setFontSize(10);
    doc.setFont(undefined, "bold");
    doc.text("Cliente", 14, y);
    doc.setFont(undefined, "normal");
    y += 6;
    doc.text(client.name || "", 14, y);
    y += 5;
    if (client.oldCode) {
        doc.text(`Primavera: ${client.oldCode}`, 14, y);
        y += 5;
    }
    if (client.id) {
        doc.text(`SAP: ${client.id}`, 14, y);
        y += 5;
    }
    if (client.market) {
        doc.text(`Mercado: ${client.market}`, 14, y);
        y += 5;
    }
    if (client.phone) {
        doc.text(`Telefone: ${client.phone}`, 14, y);
        y += 5;
    }
    if (order.contactPhone) {
        doc.text(`Contacto da encomenda: ${order.contactPhone}`, 14, y);
        y += 5;
    }
    const drawTableHeader = () => {
        y += 8;
        doc.setFillColor(30, 58, 138);
        doc.rect(14, y - 6, pageWidth - 28, 8, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(8);
        doc.setFont(undefined, "bold");
        doc.text("Código", 17, y - 0.5);
        doc.text("Produto", 42, y - 0.5);
        doc.text("Qtd", 130, y - 0.5);
        doc.text("Preço Unit. (Kz)", 148, y - 0.5);
        doc.text("Total (Kz)", pageWidth - 17, y - 0.5, { align: "right" });
        doc.setTextColor(0, 0, 0);
        y += 8;
        doc.setFont(undefined, "normal");
    };
    drawTableHeader();
    // Body text is a notch smaller than before (8pt vs 9pt) to make room for the new Código
    // column - the data-entry team keys this code into their own system, and asked for it in
    // its own column next to the product name rather than as a small line underneath.
    doc.setFontSize(8);
    (order.orderItems || []).forEach((item, i) => {
        const itemCode = item.code || codeByProductName[item.product] || "";
        const codeLines = doc.splitTextToSize(String(itemCode), 23);
        const productLines = doc.splitTextToSize(String(item.product || ""), 85);
        const lineStep = 4.5;
        // Código and Produto now sit side by side on the same lines rather than stacked, so a
        // row's height/page-break math follows whichever of the two wraps to more lines.
        const totalLines = Math.max(codeLines.length, productLines.length, 1);
        const rowHeight = Math.max(7, totalLines * lineStep);
        // Check against where this row's LAST line would land, not just its top, so a wrapped
        // code or product name can't run past the bottom margin.
        if (y + (totalLines - 1) * lineStep > pageHeight - bottomMargin) {
            doc.addPage();
            y = 20;
            drawTableHeader();
            doc.setFontSize(8);
        }
        const unitPrice = item.quantity ? item.valueKz / item.quantity : 0;
        if (i % 2 === 1) {
            doc.setFillColor(245, 245, 244);
            doc.rect(14, y - 5, pageWidth - 28, rowHeight, "F");
        }
        doc.text(codeLines, 17, y);
        doc.text(productLines, 42, y);
        doc.text(String(item.quantity), 130, y);
        doc.text(unitPrice.toLocaleString("pt-PT", { maximumFractionDigits: 0 }), 148, y);
        doc.text(item.valueKz.toLocaleString("pt-PT", { maximumFractionDigits: 0 }), pageWidth - 17, y, { align: "right" });
        y += rowHeight;
    });
    if (y > pageHeight - bottomMargin - 40) {
        doc.addPage();
        y = 20;
    }
    y += 3;
    doc.setDrawColor(210, 210, 210);
    doc.line(14, y, pageWidth - 14, y);
    y += 10;
    doc.setFontSize(13);
    doc.setFont(undefined, "bold");
    doc.text("TOTAL", 130, y);
    doc.text(`${(order.orderTotal || 0).toLocaleString("pt-PT")} Kz`, pageWidth - 17, y, { align: "right" });
    y += 20;
    doc.setFontSize(8);
    doc.setFont(undefined, "italic");
    doc.setTextColor(120, 120, 120);
    doc.text("Este documento é uma fatura proforma e não substitui a fatura fiscal final.", 14, y);
    y += 5;
    doc.text(`Emitido por: ${performerName}${performerRole ? " (" + performerRole + ")" : ""}`, 14, y);
    const safeClientName = (client.name || "cliente").replace(/[^a-zA-Z0-9]+/g, "_");
    doc.save(`fatura_proforma_${safeClientName}_${order.date}.pdf`);
}

function buildDayRoute(entries, clients) {
    return Object.entries(entries || {})
        .filter(([id, rec]) => rec.gps && (rec.status || "visited") === "visited")
        .map(([id, rec]) => {
        const client = clients.find((c) => c.id === id);
        return {
            lat: rec.gps.lat,
            lng: rec.gps.lng,
            time: rec.timestamp ? formatTimeLocal(rec.timestamp) : "",
            label: client ? client.name : id,
            market: client ? client.market : "",
            timestamp: rec.timestamp || "",
        };
    })
        .sort((a, b) => a.timestamp.localeCompare(b.timestamp));
}
function buildWeeklyRoute(repName, clients) {
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const repClients = clients.filter((c) => c.salesperson === repName);
    const hasTwoWeek = repClients.some((c) => c.weekLabel);
    const buildDays = (weekLabel) => days.map((day) => {
        const dayClients = repClients.filter((c) => c.dayOfWeek === day && (!weekLabel || c.weekLabel === weekLabel));
        const markets = [...new Set(dayClients.map((c) => c.market))];
        return { day, market: markets.join(" / "), clients: dayClients };
    });
    if (!hasTwoWeek) {
        return { type: "single", days: buildDays(null) };
    }
    return { type: "two-week", weekA: buildDays("Week A"), weekB: buildDays("Week B") };
}
function haversineKm(a, b) {
    const R = 6371;
    const dLat = ((b.lat - a.lat) * Math.PI) / 180;
    const dLng = ((b.lng - a.lng) * Math.PI) / 180;
    const lat1 = (a.lat * Math.PI) / 180;
    const lat2 = (b.lat * Math.PI) / 180;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
}
function totalRouteDistanceKm(points) {
    let total = 0;
    for (let i = 1; i < points.length; i++)
        total += haversineKm(points[i - 1], points[i]);
    return total;
}
function RouteMapView({ points }) {
    const containerRef = useRef(null);
    const mapRef = useRef(null);
    useEffect(() => {
        if (!containerRef.current || typeof L === "undefined")
            return;
        if (mapRef.current) {
            mapRef.current.remove();
            mapRef.current = null;
        }
        if (points.length === 0)
            return;
        const map = L.map(containerRef.current, { zoomControl: true });
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors",
            maxZoom: 19,
        }).addTo(map);
        const latlngs = points.map((p) => [p.lat, p.lng]);
        L.polyline(latlngs, { color: "#1e3a8a", weight: 3, dashArray: "6 6" }).addTo(map);
        points.forEach((p, i) => {
            const isFirst = i === 0;
            const isLast = i === points.length - 1 && points.length > 1;
            const bg = isFirst ? "#0f172a" : isLast ? "#e11d48" : "#1e3a8a";
            const icon = L.divIcon({
                className: "",
                html: `<div style="background:${bg};color:#fff;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.3);border:2px solid white;"><span style="transform:rotate(45deg);font-size:11px;font-weight:700;">${i + 1}</span></div>`,
                iconSize: [26, 26],
                iconAnchor: [13, 26],
            });
            L.marker([p.lat, p.lng], { icon }).addTo(map).bindPopup(`<b>${i + 1}. ${p.label}</b><br/>${p.market || ""} ${p.time ? "· " + p.time : ""}`);
        });
        if (latlngs.length === 1) {
            map.setView(latlngs[0], 15);
        }
        else {
            map.fitBounds(L.latLngBounds(latlngs), { padding: [30, 30] });
        }
        mapRef.current = map;
        return () => { map.remove(); mapRef.current = null; };
    }, [points]);
    if (points.length === 0) {
        return React.createElement("div", { className: "bg-stone-100 rounded-xl p-8 text-center text-stone-400 text-sm" }, "Sem visitas com localiza\u00E7\u00E3o registada neste dia.");
    }
    return React.createElement("div", { ref: containerRef, style: { height: "380px", width: "100%", borderRadius: "12px", position: "relative", isolation: "isolate", zIndex: 0 } });
}

// ---- Stale-app banner ----
// A PWA already open (especially on iOS, backgrounded rather than fully closed) keeps
// running the JS it loaded, even after a newer index.html is uploaded and the service
// worker has it ready for the NEXT load. That makes an already-fixed bug look like it's
// still happening. This checks the live file every so often (and whenever the app comes
// back to the foreground) for a newer APP_BUILD, and offers a one-tap reload instead of
// silently doing nothing.
(function () {
    function extractBuild(html) {
        const m = html.match(/const APP_BUILD = "([^"]+)"/);
        return m ? m[1] : null;
    }
    function showBanner() {
        if (document.getElementById("app-update-banner"))
            return;
        const bar = document.createElement("div");
        bar.id = "app-update-banner";
        bar.textContent = "Nova versão disponível — toque para atualizar";
        bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#b45309;color:#fff;text-align:center;padding:10px 12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;";
        bar.onclick = () => window.location.reload();
        document.body.appendChild(bar);

        try {
            const res = await fetch(window.location.pathname + "?_v=" + Date.now(), { cache: "no-store" });

            const remoteBuild = extractBuild(text);

        if (document.visibilityState === "visible")

    setTimeout(checkForUpdate, 15000);
    setInterval(checkForUpdate, 5 * 60 * 1000);
